<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>研究領域 | CED Lab</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
    <link
      rel="stylesheet"
      href="directory.css"
    />
    <link
      rel="stylesheet"
      href="research.css"
    />
  </head>
  <body>
    <div data-include="partials/header.html"></div>
    <main
      class="wrap hero directory research-page"
      data-directory="areas"
    >
      <div class="directory-heading">
        <p class="eyebrow">CED LAB · RESEARCH</p>
        <h1>研究領域</h1>
        <p class="muted">以實驗室為核心，探索目前進行中的研究與歷屆研究。</p>
      </div>
      <nav
        class="section-nav"
        aria-label="頁面區塊"
      >
        <a href="#current">進行中的研究</a>
        <a href="#historical">歷屆研究</a>
      </nav>
      <p
        id="directory-status"
        role="status"
      >
        正在載入資料…
      </p>
      <noscript><p>請啟用 JavaScript 以查看成員與研究資料。</p></noscript>
      <section
        class="directory-section"
        id="current"
        aria-labelledby="current-title"
      >
        <h2 id="current-title">進行中的研究</h2>
        <p class="muted">
          從田間作業、水域清理到綠地維護，發展回應實際需求的研究方向。
        </p>
        <div data-section="current"></div>
      </section>
      <section
        class="directory-section"
        id="historical"
        aria-labelledby="historical-title"
      >
        <h2 id="historical-title">歷屆研究</h2>
        <p class="muted">歷年研究卡片示範；研究內容與年度均非實際紀錄。</p>
        <div data-section="historical"></div>
      </section>
    </main>
    <div data-include="partials/footer.html"></div>
    <script src="include.js"></script>
    <script src="script.js"></script>
    <script
      type="module"
      src="js/directory.js"
    ></script>
  </body>
</html>
