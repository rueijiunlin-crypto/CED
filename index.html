        </div>

            <a class="btn ghost" href="pi.html">查看完整介紹</a>
          </div>
        </div>
      </section>

      <section aria-labelledby="home-research-title">
        <div class="section-title">

          <a class="more" href="areas.html">查看全部</a>

          <a class="card home-research-card" href="areas/research.html?id=mowing-robot">

          <a class="card home-research-card" href="areas/research.html?id=thinning-weeding-robot">

          </a>
          <a class="card home-research-card" href="areas/research.html?id=marine-trash-collection-vessel">

            <h3>垃圾收集海漂船</h3>
