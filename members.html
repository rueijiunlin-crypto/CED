<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>研究成員 | CED Lab</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="css/style.css"
    />
    <link
      rel="stylesheet"
      href="css/directory.css"
    />
  </head>
  <body>
    <div data-include="partials/header.html"></div>
    <main
      class="wrap hero directory"
      data-directory="members"
    >
      <div class="directory-heading">
        <p class="eyebrow">CED LAB · PEOPLE &amp; RESEARCH</p>
        <h1>研究成員</h1>
        <p class="muted">研究生、專題團隊與歷屆成員的展示模板。</p>
      </div>
      <p class="sample-notice">
        範例資料展示｜姓名、年級、學位、年度與研究關聯僅供模板測試，並非正式名單或成果。目前全部使用示範文字與預設圖片，尚未套用正式內容。
      </p>
      <nav
        class="section-nav"
        aria-label="頁面區塊"
      >
        <a href="#masters">在籍碩士研究生</a><a href="#groups">大學部專題生</a
        ><a href="#alumni">歷屆畢業成員</a>
      </nav>
      <p
        id="directory-status"
        role="status"
      >
        正在載入資料…
      </p>
      <noscript><p>請啟用 JavaScript 以查看成員與研究資料。</p></noscript>
      <section
        class="directory-section"
        id="masters"
        aria-labelledby="masters-title"
      >
        <h2 id="masters-title">在籍碩士研究生</h2>
        <p class="muted">以個人為起點，探索彼此連結的研究方向。</p>
        <div data-section="masters"></div>
      </section>
      <section
        class="directory-section"
        id="groups"
        aria-labelledby="groups-title"
      >
        <h2 id="groups-title">大學部專題生</h2>
        <p class="muted">以團隊合作，串聯設計、實作與驗證。</p>
        <div data-section="groups"></div>
      </section>
      <section
        class="directory-section"
        id="alumni"
        aria-labelledby="alumni-title"
      >
        <h2 id="alumni-title">歷屆畢業成員</h2>
        <p class="muted">依畢業年度排列，保留研究歷程的連結。</p>
        <div data-section="alumni"></div>
      </section>
    </main>
    <div data-include="partials/footer.html"></div>
    <script src="js/include.js"></script>
    <script src="js/script.js"></script>
    <script
      type="module"
      src="js/directory.js"
    ></script>
  </body>
</html>
